name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install -e '.[quality]'
      - name: Run Ruff
        run: python -m ruff check src tests scripts integrations experiments/utility-retention studies --exclude "**/results/**"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[test,experiments]'
      - name: Restore checksum-pinned v0.2 evidence
        run: python scripts/release_artifacts.py restore-results
      - name: Audit v0.2 evidence
        run: python scripts/audit_v02.py
      - name: Independently verify E4 set algebra
        run: python experiments/utility-retention/audits/verify_e4.py experiments/utility-retention/results/e4-diagnostic-model
      - name: Run CPU test suite
        run: python -m pytest -q
